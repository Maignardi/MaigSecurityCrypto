name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  android-and-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM & Android host/sample UI tests and Android Lint
        run: ./gradlew :encrypted-datastore:jvmTest :encrypted-datastore:testAndroidHostTest :sample-android:testDebugUnitTest :sample-android:lintDebug

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test iOS targets
        run: ./gradlew :encrypted-datastore:compileKotlinIosArm64 :encrypted-datastore:iosSimulatorArm64Test
