name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  android-and-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM & Android host/sample UI tests, minSdk bytecode check, and compile device tests
        run: ./gradlew :MaigSecurityCrypto:jvmTest :MaigSecurityCrypto:testAndroidHostTest :MaigSecurityCrypto:verifyAndroidMinSdk23Compatibility :MaigSecurityCrypto:compileAndroidDeviceTest :sample-android:testDebugUnitTest :sample-android:lintDebug

  android-instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run AndroidKeyStore instrumented tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :MaigSecurityCrypto:connectedAndroidDeviceTest --info
      - name: Upload instrumented test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-reports
          path: MaigSecurityCrypto/build/reports/androidTests/

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test iOS targets
        run: ./gradlew :MaigSecurityCrypto:compileKotlinIosArm64 :MaigSecurityCrypto:iosSimulatorArm64Test
